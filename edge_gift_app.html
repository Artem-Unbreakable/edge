<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Edge Gift Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: #0b0e14;
      --card-bg: #161b26;
      --card-border: #232a3b;
      --accent-color: #0088cc;
      --accent-gradient: linear-gradient(135deg, #0088cc, #00b4d8);
      --gold-gradient: linear-gradient(135deg, #ffb703, #fb8500);
      --text-main: #ffffff;
      --text-muted: #8e94a8;
      --radius: 16px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; user-select: none; }
    body { background-color: var(--bg-color); color: var(--text-main); min-height: 100vh; padding-bottom: 90px; }

    header {
      background: rgba(22, 27, 38, 0.9);
      backdrop-filter: blur(12px);
      padding: 16px;
      position: sticky; top: 0; z-index: 100;
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid var(--card-border);
    }

    .brand { font-weight: 900; font-size: 1.2rem; background: linear-gradient(45deg, #0088cc, #ffb703); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .balance-badge { background: var(--card-bg); border: 1px solid var(--card-border); padding: 8px 16px; border-radius: 20px; font-weight: 800; }
    .balance-badge span { color: #ffb703; }

    .screen { display: none; padding: 16px; }
    .screen.active { display: block; }

    .section-title { font-size: 0.9rem; font-weight: 800; margin-bottom: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }

    .cases-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .case-card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius);
      padding: 16px; display: flex; flex-direction: column; align-items: center; text-align: center;
      cursor: pointer; transition: transform 0.15s;
    }
    .case-card:active { transform: scale(0.96); }
    .case-icon { font-size: 3.5rem; margin: 10px 0; }
    .case-title { font-size: 0.95rem; font-weight: 700; margin-bottom: 6px; }
    .case-price { background: rgba(0, 136, 204, 0.2); color: var(--accent-color); padding: 6px 12px; border-radius: 12px; font-weight: 800; font-size: 0.85rem; width: 100%; margin-top: 6px; }

    /* Рулетка */
    .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(11, 14, 20, 0.95); backdrop-filter: blur(20px); z-index: 200; flex-direction: column; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .roulette-box { width: 100%; max-width: 360px; height: 130px; background: var(--card-bg); border: 2px solid var(--accent-color); border-radius: var(--radius); position: relative; overflow: hidden; margin: 20px 0; }
    .pointer { position: absolute; top: 0; bottom: 0; left: 50%; width: 4px; background: #ffb703; transform: translateX(-50%); z-index: 10; box-shadow: 0 0 10px #ffb703; }
    .track { display: flex; height: 100%; position: absolute; left: 0; top: 0; transition: transform 5s cubic-bezier(0.1, 1, 0.1, 1); }
    .track-item { width: 100px; height: 100%; flex-shrink: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; border-right: 1px solid var(--card-border); padding: 6px; }

    .btn { width: 100%; padding: 14px; border: none; border-radius: var(--radius); font-weight: 800; font-size: 1rem; cursor: pointer; text-align: center; }
    .btn-primary { background: var(--accent-gradient); color: #fff; }
    .btn-gold { background: var(--gold-gradient); color: #111; margin-top: 10px; }

    /* Инвентарь */
    .inventory-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 16px; }
    .inv-item { background: var(--card-bg); border: 1px solid var(--card-border); border-radius: var(--radius); padding: 12px; text-align: center; }

    nav { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(22, 27, 38, 0.95); backdrop-filter: blur(16px); border-top: 1px solid var(--card-border); display: flex; justify-content: space-around; padding: 12px 0; z-index: 100; }
    .nav-btn { display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--text-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .nav-btn.active { color: var(--accent-color); }
  </style>
</head>
<body>

  <header>
    <div class="brand">🎁 EDGE GIFT</div>
    <div class="balance-badge"><span id="balance">1,000</span> 🪙</div>
  </header>

  <div id="screen-cases" class="screen active">
    <div class="section-title">🎁 Кейсы Telegram Подарков</div>
    <div class="cases-grid">
      <div class="case-card" onclick="startSpin('starter', 100)">
        <div class="case-icon">🎁</div>
        <div class="case-title">Starter Box</div>
        <div class="case-price">100 🪙</div>
      </div>
      <div class="case-card" onclick="startSpin('stars', 500)">
        <div class="case-icon">⭐</div>
        <div class="case-title">Stars Box</div>
        <div class="case-price">500 🪙</div>
      </div>
      <div class="case-card" onclick="startSpin('vip', 2500)">
        <div class="case-icon">💎</div>
        <div class="case-title">High Roller NFT</div>
        <div class="case-price">2,500 🪙</div>
      </div>
    </div>
  </div>

  <div id="screen-inventory" class="screen">
    <div class="section-title">🎒 Моя Коллекция NFT</div>
    <div class="inventory-grid" id="inventory-list"></div>
    <button class="btn btn-gold" onclick="sellAll()">💰 Продать всё на Fragment</button>
  </div>

  <div id="screen-deposit" class="screen">
    <div class="section-title">⭐ Пополнение Stars (1 Star = 10 🪙)</div>
    <div class="cases-grid">
      <div class="case-card" onclick="buyStars(10)">
        <div class="case-icon">⭐</div>
        <div class="case-title">10 Stars</div>
        <div class="case-price">+100 🪙</div>
      </div>
      <div class="case-card" onclick="buyStars(100)">
        <div class="case-icon">⭐</div>
        <div class="case-title">100 Stars</div>
        <div class="case-price">+1,000 🪙</div>
      </div>
    </div>
  </div>

  <!-- Модалка с Рулеткой -->
  <div class="modal" id="roulette-modal">
    <h3 id="modal-status">Открываем бокс...</h3>
    <div class="roulette-box">
      <div class="pointer"></div>
      <div class="track" id="track"></div>
    </div>
    <button class="btn btn-primary" id="modal-close" style="display:none;" onclick="closeModal()">Забрать выигрыш</button>
  </div>

  <nav>
    <div class="nav-btn active" onclick="showScreen('cases', this)"><div>🎁</div>Кейсы</div>
    <div class="nav-btn" onclick="showScreen('inventory', this)"><div>🎒</div>Коллекция</div>
    <div class="nav-btn" onclick="showScreen('deposit', this)"><div>⭐</div>Stars</div>
  </nav>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    
    // Получаем Telegram ID текущего пользователя
    const userId = tg.initDataUnsafe?.user?.id || 123456789;

    async function loadUserData() {
      const res = await fetch(`/api/user?user_id=${userId}`);
      const data = await res.json();
      document.getElementById('balance').innerText = Math.round(data.user.balance).toLocaleString();
      
      const invList = document.getElementById('inventory-list');
      invList.innerHTML = '';
      data.inventory.forEach(item => {
        invList.innerHTML += `
          <div class="inv-item">
            <div style="font-size:2rem">${item.icon}</div>
            <div style="font-size:0.8rem; font-weight:700">${item.name}</div>
            <div style="font-size:0.8rem; color:#ffb703; font-weight:800">${item.price} 🪙</div>
          </div>
        `;
      });
    }

    function showScreen(name, el) {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`screen-${name}`).classList.add('active');
      el.classList.add('active');
      if (name === 'inventory') loadUserData();
    }

    async function startSpin(caseKey, price) {
      const modal = document.getElementById('roulette-modal');
      const track = document.getElementById('track');
      const modalStatus = document.getElementById('modal-status');
      const closeBtn = document.getElementById('modal-close');

      modal.classList.add('active');
      closeBtn.style.display = 'none';
      modalStatus.innerText = 'Крутим рулетку...';

      // Генерация фейковой ленты предметов для анимации
      const fakeIcons = ['🌟', '🎁', '🧸', '💖', '🎉', '📱', '🖼', '👑'];
      track.style.transition = 'none';
      track.style.transform = 'translateX(0px)';
      track.innerHTML = '';

      for (let i = 0; i < 40; i++) {
        const randomIcon = fakeIcons[Math.floor(Math.random() * fakeIcons.length)];
        track.innerHTML += `
          <div class="track-item">
            <div style="font-size:2rem">${randomIcon}</div>
            <div style="font-size:0.65rem; color:#8e94a8">Item</div>
          </div>
        `;
      }

      // Запрос выпавшего предмета к бэкенду
      const res = await fetch('/api/open_case', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, case_key: caseKey })
      });

      const data = await res.json();
      if (data.error) {
        alert(data.error);
        modal.classList.remove('active');
        return;
      }

      // Вставляем победивший предмет на 32-ю позицию ленты
      const trackItems = track.querySelectorAll('.track-item');
      trackItems[30].innerHTML = `
        <div style="font-size:2rem">${data.item.icon}</div>
        <div style="font-size:0.65rem; color:#ffb703; font-weight:800">${data.item.name}</div>
      `;

      // Анимация прокрутки
      setTimeout(() => {
        track.style.transition = 'transform 4.5s cubic-bezier(0.1, 1, 0.1, 1)';
        track.style.transform = `translateX(-${30 * 100 - 130}px)`;
      }, 100);

      setTimeout(() => {
        modalStatus.innerText = `Выпало: ${data.item.name} (${data.item.price} 🪙)!`;
        closeBtn.style.display = 'block';
        loadUserData();
      }, 4800);
    }

    function closeModal() {
      document.getElementById('roulette-modal').classList.remove('active');
    }

    async function sellAll() {
      const res = await fetch('/api/sell_all', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId })
      });
      const data = await res.json();
      alert(`Успешно продано на сумму +${data.sold_amount} 🪙!`);
      loadUserData();
    }

    async function buyStars(stars) {
      const res = await fetch('/api/pay_stars', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ user_id: userId, stars: stars })
      });
      const data = await res.json();
      if (data.invoice_link) {
        tg.openInvoice(data.invoice_link, (status) => {
          if (status === 'paid') {
            alert('Оплата прошла успешно!');
            loadUserData();
          }
        });
      }
    }

    loadUserData();
  </script>
</body>
</html>
